name: Market Pulse — author new report

# Runs ~30 min before refresh.yml so the new report exists by the time the
# price refresh fires. When this commits, rebuild-manifest.yml auto-fires on the
# push to reports/**, then refresh.yml fires on its own cron and tops up prices.
#
#   - Sunday    19:30 UTC  (cron 18fb2115, weekly)   -> refresh.yml @ 20:00 UTC
#   - Wednesday 05:30 UTC  (cron 92ba41d1, midweek)  -> refresh.yml @ 06:00 UTC
#
# GitHub Actions cron is best-effort and routinely lags 30 min – 2 h under
# load. If author.yml ends up firing AFTER refresh.yml due to that lag, the
# refresh just runs on the prior report; the next refresh tick will pick up
# the new one.
on:
  schedule:
    - cron: "30 19 * * 0"
    - cron: "30 5 * * 3"
  workflow_dispatch:
    inputs:
      run_type:
        description: "Force run type (otherwise derived from weekday)"
        type: choice
        options: ["", "weekly", "midweek"]
        default: ""
      date:
        description: "Override report date YYYY-MM-DD (otherwise today UTC) — use to backfill a missed run"
        type: string
        default: ""
      dry_run:
        description: "Skip writing files"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Shared with refresh.yml so author and refresh serialize against each other.
  # Without this, refresh.yml can push between author.yml's commit and push and
  # reject author's push with "fetch first" (non-fast-forward).
  group: market-pulse
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pdf-export/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install PDF export dependencies
        run: cd pdf-export && npm ci --silent --no-fund --no-audit

      - name: Author new report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${{ inputs.run_type }}" ]; then ARGS+=(--type "${{ inputs.run_type }}"); fi
          if [ -n "${{ inputs.date }}" ];     then ARGS+=(--date "${{ inputs.date }}"); fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          python author_report.py "${ARGS[@]}"

      - name: Rebuild manifest
        if: inputs.dry_run != true
        run: python build_manifest.py

      - name: Generate PDF
        # Soft-fail: a PDF generation failure must not block the publish path.
        # The .md/.json are already on disk; if the PDF fails we still want
        # the report committed and the ClickUp summary posted.
        if: inputs.dry_run != true
        continue-on-error: true
        run: |
          set -euo pipefail
          slug=$(python -c "import json; print(json.load(open('reports/manifest.json'))['reports'][0]['slug'])")
          echo "Generating PDF for $slug..."
          cd pdf-export
          npx tsx generate_report_pdf.tsx "$slug"

      - name: Check for changes
        id: diff
        if: inputs.dry_run != true
        run: |
          if git diff --quiet --exit-code -- reports/ cron_tracking/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new report committed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- reports/ cron_tracking/
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "${{ github.event.schedule }}" in
            "30 19 * * 0") label="Sunday weekly report" ;;
            "30 5 * * 3")  label="Wednesday mid-week report" ;;
            *)             label="Manual report" ;;
          esac
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git add reports/ cron_tracking/
          git commit -m "Auto-author: ${label} — ${ts}" \
                     -m "Generated via Claude API (sonnet-4-6). refresh.yml will top up prices on the next cron tick."
          # Rebase-then-push with retry: handles the case where someone pushed
          # to main while this workflow was running. The author commit touches
          # reports/ + cron_tracking/. The only realistic conflict is on
          # reports/manifest.json -- it's a generated file, so we regenerate
          # it from the merged reports/ state instead of trying to merge.
          # Any other conflict is real and we abort.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              :  # clean rebase
            else
              conflicted=$(git diff --name-only --diff-filter=U | sort -u | tr '\n' ' ')
              # Trim trailing space for clean comparison.
              conflicted=$(echo "$conflicted" | sed 's/ *$//')
              if [ "$conflicted" = "reports/manifest.json" ]; then
                echo "Manifest-only conflict on attempt $attempt -- regenerating." >&2
                python build_manifest.py
                git add reports/manifest.json
                if ! git -c core.editor=true rebase --continue; then
                  echo "rebase --continue failed unexpectedly." >&2
                  git rebase --abort || true
                  exit 1
                fi
              else
                echo "Non-manifest conflicts ($conflicted) on attempt $attempt -- aborting." >&2
                git rebase --abort
                exit 1
              fi
            fi
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            sleep $((attempt * 5))
            echo "Push rejected on attempt $attempt, retrying..." >&2
          done
          echo "Push failed after 5 attempts." >&2
          exit 1

      - name: Post summary to ClickUp
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        # Soft-fail: post_to_clickup.py exits 0 on missing token or API error
        # so a chat hiccup never blocks the publish. continue-on-error is
        # belt-and-suspenders in case the script itself crashes.
        continue-on-error: true
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          slug=$(python -c "import json; print(json.load(open('reports/manifest.json'))['reports'][0]['slug'])")
          echo "Posting $slug summary to ClickUp..."
          python post_to_clickup.py "$slug"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "### New report authored" >> "$GITHUB_STEP_SUMMARY"
            git log -1 --pretty=format:"- %s%n- %h%n- %ad" --date=iso >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "### No new report this run" >> "$GITHUB_STEP_SUMMARY"
          fi
